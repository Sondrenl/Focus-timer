  <line x1="8" y1="13" x2="8" y2="15.5" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="16" y1="13" x2="16" y2="15.5" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
