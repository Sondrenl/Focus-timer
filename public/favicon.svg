  <path
    d="M16 8.5L18.8 4.8L16.8 7.8L21.5 6.5L17.5 9.2L19.5 11.5L16 9.8L12.5 11.5L14.5 9.2L10.5 6.5L15.2 7.8L13.2 4.8L16 8.5Z"
